<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FaktFree">
    <title>FaktFree</title>
    <!-- Jednobarevná značka: účtenka s trhaným okrajem a vyříznutou fajfkou.
         Barví se podle nastavení systému (světlé/tmavé téma prohlížeče).
         Záměrně mono – barevné ikony aplikace jsou jinde, viz brand/README.md.

         Značka je zvětšená měřítkem 4/3 (= 64/48), takže kresba vyplňuje celou
         plochu 64×64 – stejně velká jako ostatní ikony aplikace. Maska s fajfkou
         je ve stejném souřadném systému, takže se zvětšuje spolu s účtenkou. -->
    <style>
        svg { color: #0f172a; }
        @media (prefers-color-scheme: dark) { svg { color: #e5e7eb; } }
    </style>
    <mask id="ff-cut">
        <rect width="64" height="64" fill="#fff"/>
        <path d="M23.5 29l6 6 12-13" fill="none" stroke="#000" stroke-width="5.5"
              stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <g transform="translate(32 32) scale(1.3333333) translate(-32 -32)">
        <path d="M18 8h28a3 3 0 0 1 3 3v39l-5.667 6-5.667-6-5.667 6-5.667-6-5.667 6-5.667-6V11a3 3 0 0 1 3-3z"
              fill="currentColor" mask="url(#ff-cut)"/>
    </g>
</svg>
