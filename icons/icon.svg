<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FaktFree">
    <title>FaktFree</title>
    <!--
      Značka pro ikony aplikace (průhledné pozadí) – stejné tvary jako
      `brand/logo-mark-color.svg`, ale zvětšená tak, aby kresba vyplnila celou
      plochu 64×64: tvar značky má 28×48 jednotek, proto měřítko 64/48 = 4/3.

      Odsazení (10 % na každou stranu) se doplňuje až při použití, ne v souboru –
      tak ikona sedí stejně velká jako ostatní ikony v liště.
    -->
    <defs>
        <linearGradient id="ff-blue" x1="18" y1="56" x2="46" y2="8" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2563eb"/>
            <stop offset="1" stop-color="#3b82f6"/>
        </linearGradient>
    </defs>
    <g transform="translate(32 32) scale(1.3333333) translate(-32 -32)">
        <path d="M18 8h28a3 3 0 0 1 3 3v39l-5.667 6-5.667-6-5.667 6-5.667-6-5.667 6-5.667-6V11a3 3 0 0 1 3-3z"
              fill="url(#ff-blue)"/>
        <path d="M23.5 29l6 6 12-13" fill="none" stroke="#ffffff" stroke-width="5.5"
              stroke-linecap="round" stroke-linejoin="round"/>
    </g>
</svg>
