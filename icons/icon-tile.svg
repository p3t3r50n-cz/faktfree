<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="FaktFree">
    <title>FaktFree</title>
    <!--
      Předloha pro `icon-maskable-512.png` – značka na plné ploše (barva pozadí
      aplikace). Značka je zvětšená skoro na doraz: rohy obdélníku účtenky se
      u měřítka 1,12 dotýkají kruhu o poloměru 32 jednotek, na který Android
      maskable ikonu ořezává (64 × 1,12 / 2 ≈ 32). Větší měřítko by už rohy
      ukouslo.
      Když se značka mění, upravte ji i tady a vyrenderujte PNG (viz brand/README.md).
    -->
    <defs>
        <linearGradient id="ff-blue" x1="18" y1="56" x2="46" y2="8" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2563eb"/>
            <stop offset="1" stop-color="#3b82f6"/>
        </linearGradient>
    </defs>
    <rect width="64" height="64" fill="#eef2f8"/>
    <g transform="translate(32 32) scale(1.12) translate(-32 -32)">
        <path d="M18 8h28a3 3 0 0 1 3 3v39l-5.667 6-5.667-6-5.667 6-5.667-6-5.667 6-5.667-6V11a3 3 0 0 1 3-3z"
              fill="url(#ff-blue)"/>
        <path d="M23.5 29l6 6 12-13" fill="none" stroke="#ffffff" stroke-width="5.5"
              stroke-linecap="round" stroke-linejoin="round"/>
    </g>
</svg>
